[workspace]
members = ["*"]
exclude = ["target"]
resolver = "3"

[workspace.dependencies]
t = { package = "tester", path = "./tester" }

libtest-mimic = "0.8"
openrussh-client = { path = ".." }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
